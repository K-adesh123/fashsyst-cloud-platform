name: API CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t fashsyst-api:ci .

      - name: Start container
        run: docker run -d --name api-ci -p 127.0.0.1:8000:8000 fashsyst-api:ci

      - name: Verify container health endpoint
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(15):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8000/health", timeout=2
                  ) as response:
                      assert response.status == 200
                      assert json.load(response) == {"status": "ok"}
                  print("Container health check passed")
                  break
              except Exception:
                  if attempt == 14:
                      raise
                  time.sleep(2)
          PY

      - name: Show container logs
        if: always()
        run: docker logs api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f api-ci || true